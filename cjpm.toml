[package]
  cjc-version = "1.1.0"
  name = "toml_all"
  organization = ""
  description = "Aggregate package for the Cangjie TOML library"
  version = "0.1.0"
  target-dir = ""
  script-dir = ""
  output-type = "static"
  compile-option = "-O2"
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  toml = { path = "packages/toml" }
  toml_macros = { path = "packages/toml_macros" }

[profile.bench]
  no-color = true
  verbose = true

[profile.bench.build]
  compile-option = "-O2"
  link-option = ""
